project:
  name: cavendish-harvest-arrival-predictor
  model_version: tabular-rf-v1
  random_seed: 42

paths:
  train_data: data/sample/cavendish_sample.csv
  prediction_input: data/sample/cavendish_inference_sample.csv
  model_output: models/cavendish_predictor.joblib
  metrics_output: reports/training_metrics.json
  evaluation_output: reports/evaluation_metrics.json
  predictions_output: reports/predictions.csv

data:
  group_column: bunch_id
  test_size: 0.25
  required_input_columns:
    - plant_id
    - bunch_id
    - planting_date
    - flowering_date
    - photo_date
  target_columns:
    harvest_date: harvest_date
    arrival_date: arrival_date
    readiness_status: readiness_status

model:
  regression:
    n_estimators: 120
    max_depth: 10
    min_samples_leaf: 1
    n_jobs: -1
  classification:
    enabled: true
    n_estimators: 120
    max_depth: 10
    min_samples_leaf: 1
    n_jobs: -1
